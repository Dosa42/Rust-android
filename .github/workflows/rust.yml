name: Omarchy Adaptive Release APK Build & Dynamic Versioning CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_strategy:
        description: 'Version Increment Strategy'
        required: true
        default: 'auto_increment'
        type: choice
        options:
          - auto_increment
          - patch
          - minor
          - major
      enable_healing:
        description: 'Enable live runtime dependency healing & retry loop'
        required: true
        default: true
        type: boolean
      custom_version_suffix:
        description: 'Optional custom version suffix (e.g., beta, rc1)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build & Heal Release APK (${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17]
        distribution: ['temurin']

    steps:
      - name: 📥 Checkout Repository (Deep History for SSoT & Tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Dynamic Semantic Version & Unique File Name Generator
        id: versioning
        run: |
          set -euo pipefail

          # 1. Base Version Parsing from Latest Git Tag or Default SSoT Specification
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          CLEAN_TAG=${LATEST_TAG#v}

          IFS='.' read -r -a VERSION_PARTS <<< "$CLEAN_TAG"
          MAJOR=${VERSION_PARTS[0]:-1}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          STRATEGY="${{ github.event.inputs.version_strategy || 'auto_increment' }}"
          RUN_NUM="${{ github.run_number }}"
          BUILD_TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo "latest")

          # 2. Compute Unique Dynamic Version (v1.2.0, v2.0.0, etc.)
          case "$STRATEGY" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
            auto_increment|*)
              # Increment minor / patch based on GitHub Actions run number
              PATCH=$((PATCH + RUN_NUM))
              ;;
          esac

          SUFFIX="${{ github.event.inputs.custom_version_suffix || '' }}"
          if [ -n "$SUFFIX" ]; then
            CALCULATED_VERSION="v${MAJOR}.${MINOR}.${PATCH}-${SUFFIX}"
          else
            CALCULATED_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          VERSION_CODE=$(( (MAJOR * 10000) + (MINOR * 100) + PATCH + RUN_NUM ))
          UNIQUE_APK_NAME="omarchy-ssot-release-${CALCULATED_VERSION}-b${RUN_NUM}-${SHORT_SHA}.apk"

          echo "========================================================"
          echo "  OMARCHY DYNAMIC SSoT VERSION RESOLUTION"
          echo "========================================================"
          echo "  Previous Tag     : $LATEST_TAG"
          echo "  Strategy         : $STRATEGY"
          echo "  Calculated Tag   : $CALCULATED_VERSION"
          echo "  Version Code     : $VERSION_CODE"
          echo "  Unique APK Name  : $UNIQUE_APK_NAME"
          echo "========================================================"

          # Export step outputs and environment variables
          echo "version_name=${CALCULATED_VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "apk_filename=${UNIQUE_APK_NAME}" >> $GITHUB_OUTPUT
          echo "build_timestamp=${BUILD_TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=${CALCULATED_VERSION}" >> $GITHUB_ENV
          echo "BUILD_VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "UNIQUE_APK_NAME=${UNIQUE_APK_NAME}" >> $GITHUB_ENV

      - name: ☕ Setup Adaptive JDK ${{ matrix.java-version }} (${{ matrix.distribution }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}
          cache: 'gradle'

      - name: 🐘 Setup Latest Stable Gradle Execution Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: 🛡️ Self-Healing Pre-Build Configuration & Secret Injection
        id: prebuild_heal
        run: |
          set -euo pipefail
          echo "[Self-Healing] Checking configuration and secret files..."

          # 1. Ensure .env exists so Secrets Gradle plugin does not fail
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "[Self-Healing] Creating .env from .env.example"
              cp .env.example .env
            else
              echo "[Self-Healing] Generating fallback .env with build placeholders"
              echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            fi
          fi

          # 2. Ensure debug keystore is decoded if available
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "[Self-Healing] Decoding debug.keystore from base64"
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          # 3. Ensure release keystore is valid or synthesize self-signed release key
          if [ ! -f my-upload-key.jks ]; then
            echo "[Self-Healing] Generating self-signed release upload keystore (my-upload-key.jks)"
            keytool -genkeypair \
              -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Omarchy SSoT, OU=Mobile, O=AI Studio, L=Cloud, S=Global, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

          # 4. Make gradlew executable
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: 🚀 Build Release APK with Live Error Healing & Retry
        id: gradle_build
        run: |
          echo "[Build Step] Starting assembleRelease with dynamic version ${BUILD_VERSION} (${BUILD_VERSION_CODE})..."

          # Helper build function passing dynamic injected version properties
          run_gradle_build() {
            if [ -f ./gradlew ]; then
              ./gradlew assembleRelease \
                -Pandroid.injected.version.name="${BUILD_VERSION}" \
                -Pandroid.injected.version.code="${BUILD_VERSION_CODE}" \
                --stacktrace \
                "$@"
            else
              gradle assembleRelease \
                -Pandroid.injected.version.name="${BUILD_VERSION}" \
                -Pandroid.injected.version.code="${BUILD_VERSION_CODE}" \
                --stacktrace \
                "$@"
            fi
          }

          # Attempt 1: Standard optimized build
          if run_gradle_build; then
            echo "[Build Success] Initial release build succeeded."
          else
            echo "⚠️ [Build Warning] Initial build encountered an error. Engaging live self-healing resolution..."

            # Self-Healing Step: Clean gradle daemon locks, refresh dependencies, and retry
            echo "[Self-Healing] Refreshing remote maven dependencies and clearing transient caches..."
            run_gradle_build --refresh-dependencies --no-daemon --rerun-tasks
          fi

      - name: 📦 Rename & Package Dynamic Versioned APK Artifact
        id: package_apk
        run: |
          set -euo pipefail

          APK_OUTPUT_DIR="app/build/outputs/apk/release"
          TARGET_APK="${APK_OUTPUT_DIR}/${UNIQUE_APK_NAME}"

          # Find generated release APK
          RAW_APK=$(find "${APK_OUTPUT_DIR}" -type f -name "*.apk" | head -n 1)

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "❌ Error: Could not locate built release APK in ${APK_OUTPUT_DIR}"
            exit 1
          fi

          echo "[Packaging] Found APK at: $RAW_APK"
          cp "$RAW_APK" "$TARGET_APK"
          echo "[Packaging] Renamed to unique artifact: $TARGET_APK"

          # Calculate SHA256 Checksum for integrity verification
          CHECKSUM=$(sha256sum "$TARGET_APK" | awk '{print $1}')
          FILESIZE=$(du -h "$TARGET_APK" | awk '{print $1}')

          echo "========================================================"
          echo "  BUILD INTEGRITY REPORT"
          echo "========================================================"
          echo "  Artifact Name : $UNIQUE_APK_NAME"
          echo "  Version Name  : $BUILD_VERSION"
          echo "  Version Code  : $BUILD_VERSION_CODE"
          echo "  File Size     : $FILESIZE"
          echo "  SHA256        : $CHECKSUM"
          echo "========================================================"

          echo "apk_path=${TARGET_APK}" >> $GITHUB_OUTPUT
          echo "checksum=${CHECKSUM}" >> $GITHUB_OUTPUT

          # Create metadata manifest
          cat <<EOF > "${APK_OUTPUT_DIR}/build-metadata.json"
          {
            "appName": "Omarchy Dynamic Launcher",
            "versionName": "${BUILD_VERSION}",
            "versionCode": ${BUILD_VERSION_CODE},
            "apkFileName": "${UNIQUE_APK_NAME}",
            "sha256": "${CHECKSUM}",
            "buildTimestamp": "${{ steps.versioning.outputs.build_timestamp }}",
            "gitCommit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF

      - name: 📤 Upload Release APK as CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.versioning.outputs.apk_filename }}
          path: |
            ${{ steps.package_apk.outputs.apk_path }}
            app/build/outputs/apk/release/build-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: 🏷️ Automated GitHub Release Publishing (Tag or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version_name }}
          name: "Release ${{ steps.versioning.outputs.version_name }} (${{ steps.versioning.outputs.build_timestamp }})"
          body: |
            ### 🚀 Omarchy Dynamic SSoT Release `${{ steps.versioning.outputs.version_name }}`
            
            **Automated Adaptive CI/CD Release Build**
            - **Version Name**: `${{ steps.versioning.outputs.version_name }}`
            - **Version Code**: `${{ steps.versioning.outputs.version_code }}`
            - **APK Filename**: `${{ steps.versioning.outputs.apk_filename }}`
            - **SHA256 Checksum**: `${{ steps.package_apk.outputs.checksum }}`
            - **Git Commit**: `${{ github.sha }}`
            
            #### 🌟 Highlights & Features
            - **Single Source of Truth (SSoT)**: Dynamic symlink engine routing to `~/.agents/skills/phone-interface.md` with 0ms hot-reload.
            - **APK Thin Wrappers**: Full intent interception for OEM system apps (`TouchWizHome_2017`, `SecSettings`, `SecMyFiles2020`).
            - **Standalone React Web Browser Framework**: In-app live preview and HTML5 visual designer.
            - **Room Database + Gemini AI Multi-Model Routing**: Fully offline-first with reactive Flow caching.
          files: |
            ${{ steps.package_apk.outputs.apk_path }}
            app/build/outputs/apk/release/build-metadata.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
